version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: carthage-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carthage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-carthage_clean}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/web/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carthage} -d ${POSTGRES_DB:-carthage_clean}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - carthage-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: carthage-web
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-carthage}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carthage_clean}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - carthage-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  carthage-network:
    driver: bridge